<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cue</title>
    <style>
      /* Shown from the first byte until the note renders: five bars in a wave, centred, fixed in size so nothing moves when the note replaces them. */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #8a8a90; }
      #boot span { width: 3px; height: 16px; margin: 0 3px; border-radius: 9999px; background: currentColor; animation: wave 1100ms cubic-bezier(0.37, 0, 0.63, 1) infinite; will-change: transform, opacity; }
      @keyframes wave { 0%, 100% { transform: scaleY(0.3); opacity: 0.5; } 50% { transform: scaleY(1); opacity: 1; } }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><span></span><span style="animation-delay: 120ms"></span><span style="animation-delay: 240ms"></span><span style="animation-delay: 360ms"></span><span style="animation-delay: 480ms"></span></div>

    <script src="/src/notes/index.tsx" type="module"></script>
  </body>
</html>
