[package]
name = "cue"
version = "0.1.0"
description = "Local desktop utility for dictating, capturing, editing, and reusing text."
authors = ["Rishik"]
license = "MIT"
repository = "https://github.com/Rishik15/cue"
readme = "../README.md"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
handy-keys = { path = "../vendor/handy-keys" }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
cpal = "0.16"
rubato = "0.16"
sherpa-onnx = "=1.13.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
regex = "1"
getrandom = "0.3"

# Windows-only for now: insertion, overlay and memory trim talk to Win32 directly.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Dwm",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
] }


# Size limit: functions stay within 50 lines (threshold in clippy.toml); CI runs clippy with -D warnings.
[lints.clippy]
too_many_lines = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true

[dev-dependencies]
proptest = "1"
