# cargo-deny policy: known vulnerabilities fail the build, duplicate versions only warn, and crates may only come from crates.io (plus the vendored copy in this repo, which is a path dependency).
# Licences are listed in THIRD_PARTY_NOTICES.md and reviewed by hand when a dependency is added.

# Cue ships for Windows only (`platform/stub.rs` just keeps other targets compiling), so advisories are judged on the Windows dependency graph. Crates that only a Linux or macOS build pulls in (the GTK stack, zbus for the single-instance plugin) are not in the shipped app and are not reported.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
# sherpa-onnx-sys pins zip 2.x and uses it only in its build script, to unpack its own prebuilt library; Cue never extracts untrusted zips with it (the dictionary pack is unpacked by Cue's own code after a SHA-256 check).
# Drop these when sherpa-onnx moves to zip 9.
ignore = ["RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
