# File: src-tauri/deny.toml
# Purpose: cargo-deny policy: known vulnerabilities fail the build, a new duplicate crate version fails unless listed under skip, and crates may only come from crates.io (plus the vendored copy in this repo, a path dependency).
# Contents: the Windows-only graph, advisories with the ignored ones and why, bans with the known duplicates, allowed sources.
# Licences are listed in THIRD_PARTY_NOTICES.md and reviewed by hand when a dependency is added.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "sherpa-onnx-sys pins zip 2.x and uses it only in its build script to unpack its own prebuilt library; Cue unpacks the dictionary pack with its own code after a SHA-256 check. Drop when sherpa-onnx moves to zip 9." },
  { id = "RUSTSEC-2026-0368", reason = "Same zip 2.x build-script use as RUSTSEC-2026-0367. Drop when sherpa-onnx moves to zip 9." },
  { id = "RUSTSEC-2026-0369", reason = "Same zip 2.x build-script use as RUSTSEC-2026-0367. Drop when sherpa-onnx moves to zip 9." },
  { id = "RUSTSEC-2026-0429", reason = "zip extract aborts on a symlink entry with a large declared size; same build-script-only zip 2.x as RUSTSEC-2026-0367. Zip 9 is the fix." },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "windows", reason = "Tauri's own tree pulls older windows-* releases than Cue; Cue cannot unify them." },
  { crate = "windows-core", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows-result", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows-strings", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows-collections", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows-future", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows-link", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows-numerics", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows-sys", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows-targets", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows-threading", reason = "windows-* family split in Tauri's tree." },
  { crate = "windows_x86_64_msvc", reason = "windows-* family split in Tauri's tree." },
  { crate = "ureq", reason = "sherpa-onnx-sys build script uses ureq 2; Cue's own downloads use ureq 3." },
  { crate = "webpki-roots", reason = "Follows the ureq 2 / ureq 3 split." },
  { crate = "base64", reason = "Transitive duplicate from upstream dependency trees (Tauri, sherpa-onnx, ureq); revisit on their upgrades." },
  { crate = "getrandom", reason = "Transitive duplicate from upstream dependency trees (Tauri, sherpa-onnx, ureq); revisit on their upgrades." },
  { crate = "bitflags", reason = "Transitive duplicate from upstream dependency trees (Tauri, sherpa-onnx, ureq); revisit on their upgrades." },
  { crate = "hashbrown", reason = "Transitive duplicate from upstream dependency trees (Tauri, sherpa-onnx, ureq); revisit on their upgrades." },
  { crate = "indexmap", reason = "Transitive duplicate from upstream dependency trees (Tauri, sherpa-onnx, ureq); revisit on their upgrades." },
  { crate = "miniz_oxide", reason = "Transitive duplicate from upstream dependency trees (Tauri, sherpa-onnx, ureq); revisit on their upgrades." },
  { crate = "png", reason = "Transitive duplicate from upstream dependency trees (Tauri, sherpa-onnx, ureq); revisit on their upgrades." },
  { crate = "syn", reason = "Transitive duplicate from upstream dependency trees (Tauri, sherpa-onnx, ureq); revisit on their upgrades." },
  { crate = "bzip2", reason = "Transitive duplicate from upstream dependency trees (Tauri, sherpa-onnx, ureq); revisit on their upgrades." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
