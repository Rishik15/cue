name: Idea or request
description: Something you would like Cue to do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the job you are doing by hand today, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Cue help?
      description: Optional. A shortcut, a button, an example of the result.
