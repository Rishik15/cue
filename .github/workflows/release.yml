# File: .github/workflows/release.yml
# Purpose: build, check and sign the installer for a pushed tag like v0.2.0 (after bumping the version everywhere and writing its CHANGELOG entry) and leave a DRAFT release with the installer and latest.json; publishing is a click by hand. The full CI suite must pass on the tagged commit first; signing and the draft wait for it.
# Contents: the tag trigger, the checks job (ci.yml reused), the release job (version check, build, installer check, signing, draft release).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - name: The tag must match the version in the files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $files = @{
            "package.json" = (Get-Content package.json -Raw | ConvertFrom-Json).version
            "tauri.conf.json" = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            "Cargo.toml" = $cargo
          }
          $files.GetEnumerator() | ForEach-Object { if ($_.Value -ne $version) { throw "$($_.Key) says $($_.Value), the tag says $version" } }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($version))$" -Quiet)) { throw "CHANGELOG.md has no entry for $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build the installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 build
      - name: Install, start, uninstall and check what is left
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 installer -Force
      - name: Sign the installer and write latest.json
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "The TAURI_SIGNING_PRIVATE_KEY secret is not set" }
          Copy-Item "src-tauri/target/release/bundle/nsis/Cue_${env:VERSION}_x64-setup.exe" .
          pnpm tauri signer sign -k $env:TAURI_SIGNING_PRIVATE_KEY -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "Cue_${env:VERSION}_x64-setup.exe"
          node scripts/ci/update-manifest.mjs $env:VERSION "Cue_${env:VERSION}_x64-setup.exe"
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "Cue_${env:VERSION}_x64-setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $entry = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -like "$env:VERSION*" } | Select-Object -First 1
          $notes = ($entry -split "`n" | Select-Object -Skip 1) -join "`n"
          "$($notes.Trim())`n`nInstaller SHA-256: ``$hash``" | Out-File -FilePath notes.md -Encoding utf8
          gh release create "${{ github.ref_name }}" $installer latest.json --draft --title "Cue $env:VERSION" --notes-file notes.md --verify-tag
