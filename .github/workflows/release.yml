name: Release

# Push a tag like v0.2.0 (after bumping the version everywhere and writing its CHANGELOG entry): this builds the installer,
# signs it with the update key, and leaves a DRAFT release with the installer and latest.json. Publishing is a click by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v2-rust
      - run: pnpm install --frozen-lockfile
      - name: The tag must match the version in the files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $files = @{
            "package.json" = (Get-Content package.json -Raw | ConvertFrom-Json).version
            "tauri.conf.json" = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          $files.GetEnumerator() | ForEach-Object { if ($_.Value -ne $version) { throw "$($_.Key) says $($_.Value), the tag says $version" } }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($version))$" -Quiet)) { throw "CHANGELOG.md has no entry for $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build the installer
        run: pnpm tauri build
      - name: Install, start, uninstall and check what is left
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/installer-check.ps1
      - name: Sign the installer and write latest.json
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "The TAURI_SIGNING_PRIVATE_KEY secret is not set" }
          Copy-Item "src-tauri/target/release/bundle/nsis/Cue_${env:VERSION}_x64-setup.exe" .
          pnpm tauri signer sign -k $env:TAURI_SIGNING_PRIVATE_KEY -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "Cue_${env:VERSION}_x64-setup.exe"
          node scripts/update-manifest.mjs $env:VERSION "Cue_${env:VERSION}_x64-setup.exe"
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "Cue_${env:VERSION}_x64-setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $entry = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -like "$env:VERSION*" } | Select-Object -First 1
          $notes = ($entry -split "`n" | Select-Object -Skip 1) -join "`n"
          "$($notes.Trim())`n`nInstaller SHA-256: ``$hash``" | Out-File -FilePath notes.md -Encoding utf8
          gh release create "${{ github.ref_name }}" $installer latest.json --draft --title "Cue $env:VERSION" --notes-file notes.md --verify-tag
