# File: .github/workflows/ci.yml
# Purpose: what must stay true in every version. Every job calls scripts/cue.ps1, the same modes a contributor runs, so CI and a laptop cannot disagree. Branch protection requires only `ci-success`.
# Contents: triggers (also weekly, and reusable by release.yml, which reads the installer_sha256 output), jobs frontend, rust, supply-chain, app (build, lifecycle, installer, hash of the one tested installer, upload of the installer and of the tested exe, installer and frontend as cue-release), and ci-success, which fails on any failed, cancelled or skipped job. Speed and memory are tracked in performance.yml, which measures the cue-release artifact of a successful run on main, never gated here.
name: CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      installer_sha256:
        description: "SHA-256 of the installer the app job tested and uploaded"
        value: ${{ jobs.app.outputs.installer_sha256 }}
  merge_group:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          rust: "false"
      - name: Types, lint, theme contrast
        run: pwsh scripts/cue.ps1 check-frontend
      - name: Frontend tests
        run: pwsh scripts/cue.ps1 test-frontend

  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Format, clippy, types
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 check
      - name: Unit tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 test

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          rust: "false"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete,cargo-deny
      - name: Unused crates, advisories, bans, sources
        run: pwsh scripts/cue.ps1 deps
      - name: Production npm advisories
        run: pwsh scripts/cue.ps1 audit

  app:
    needs: [frontend, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      installer_sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Build the app and the installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 build
      - name: Starts, opens and closes settings, leaves no orphan process
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 lifecycle
      - name: Install, start, uninstall, check what is left (-Force because the runner is disposable and lifecycle left app data)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 installer -Force
      - name: Hash the one installer that was tested
        id: hash
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -ne 1) { throw "Expected exactly one installer, found $($files.Count): $($files.Name -join ', ')" }
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLower()
          "installer sha256: $hash"
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-release
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/cue.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            dist

  ci-success:
    if: always()
    needs: [frontend, rust, supply-chain, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qv -E '^\[|\]$|^\s*"success",?$'; then
            echo "A job failed, was cancelled or was skipped."
            exit 1
          fi
