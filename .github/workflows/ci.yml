# File: .github/workflows/ci.yml
# Purpose: what must stay true in every version, split so a failure names its cause: frontend (types, lint, size limits, theme contrast), rust (format, clippy with warnings as errors, unit tests on Windows), supply-chain (advisories, unused dependencies, crate sources), installer (builds, installs, starts, uninstalls cleanly).
# Contents: triggers (docs-only changes skip the run, a newer push cancels the older run), the four jobs. The rust cache keeps target/sherpa-onnx-prebuilt because sherpa-onnx-sys caches only its build script result; scripts/ci/sherpa-guard.ps1 drops the cached build when that folder is missing. Speed and memory live in performance.yml, releases in release.yml.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "docs/**", ".github/ISSUE_TEMPLATE/**", ".github/CODEOWNERS", "packs/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pwsh ./scripts/ci/retry.ps1 "pnpm install --frozen-lockfile"
      - name: Types, lint, size limits, theme contrast
        run: pnpm check

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v2-rust
      - name: Download the speech library again if the cache lost it
        run: ./scripts/ci/sherpa-guard.ps1
      - run: pwsh ./scripts/ci/retry.ps1 "pnpm install --frozen-lockfile"
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny
      - name: Unused dependencies
        run: cargo machete src-tauri
      - name: Known vulnerabilities, yanked crates, sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config src-tauri/deny.toml check advisories bans sources

  installer:
    needs: [frontend, rust]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v2-rust
      - name: Download the speech library again if the cache lost it
        run: ./scripts/ci/sherpa-guard.ps1
      - run: pwsh ./scripts/ci/retry.ps1 "pnpm install --frozen-lockfile"
      - name: Build the installer
        run: pnpm tauri build
      - name: Install, start, uninstall, and check what is left
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify/installer-check.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: cue-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
