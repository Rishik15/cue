name: CI

# What must stay true in every version, split so a failure names its cause and the cheap checks do not wait for the expensive ones:
#   frontend      types, lint, file-size limits and theme contrast
#   rust          formatting, lint (warnings are errors) and the unit tests, on Windows (the app only builds there)
#   supply-chain  known vulnerabilities, unused dependencies and where crates come from
#   installer     the Windows installer builds, installs, starts, and uninstalls without leaving anything behind
# Speed and memory live in performance.yml; releases in release.yml.
on:
  push:
    branches: [main]
    # A change to the docs or the repository's templates builds nothing different, so it does not need a ten-minute run.
    paths-ignore: ["**.md", "LICENSE", "docs/**", ".github/ISSUE_TEMPLATE/**", ".github/CODEOWNERS", "packs/**"]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Types, lint, size limits, theme contrast
        run: pnpm check

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # sherpa-onnx-sys downloads its native library into target/sherpa-onnx-prebuilt once and caches only the build script's result.
          # Without this folder in the cache, a restored cache points at a library that is gone ("could not find native static library");
          # scripts/sherpa-guard.ps1 (the step after the cache) drops the cached build when the folder is missing.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v2-rust
      - name: Download the speech library again if the cache lost it
        run: ./scripts/sherpa-guard.ps1
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny
      - name: Unused dependencies
        run: cargo machete src-tauri
      - name: Known vulnerabilities, yanked crates, sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config src-tauri/deny.toml check advisories bans sources

  installer:
    needs: [frontend, rust]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v2-rust
      - name: Download the speech library again if the cache lost it
        run: ./scripts/sherpa-guard.ps1
      - run: pnpm install --frozen-lockfile
      - name: Build the installer
        run: pnpm tauri build
      - name: Install, start, uninstall, and check what is left
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/installer-check.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: cue-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
