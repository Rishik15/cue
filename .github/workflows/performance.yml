# File: .github/workflows/performance.yml
# Purpose: track how fast and how light the release app is over time. It measures and reports; it never fails because of a number, because a shared runner's memory, CPU and timings move with the machine and the WebView2 version. Bench failures here mean the app did not run, not that it got slower.
# Contents: triggers (a successful CI run on main, which also runs weekly; manual with the id of the CI run to measure), one job that resolves that run (it must be a successful CI run; its head commit is checked out and labels the result, so the harness and the measured exe match), downloads its cue-release artifact (the exe, installer and frontend CI built and tested, so nothing is built twice), runs the bench on it, writes a table against bench/baseline.json to the run summary and keeps the raw JSON as an artifact. Hard checks are in ci.yml (lifecycle); the numbers you act on come from `scripts/cue.ps1 bench` on your own machine.
name: Performance

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of the successful CI run whose cue-release artifact and commit are measured"
        required: true

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  track:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Resolve the CI run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a number, got '$RUN_ID'"; exit 1; }
          mapfile -t run < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.path, .conclusion, .head_sha')
          [ "${run[0]}" = .github/workflows/ci.yml ] || { echo "::error::run $RUN_ID is not a CI run (${run[0]})"; exit 1; }
          [ "${run[1]}" = success ] || { echo "::error::CI run $RUN_ID did not succeed (${run[1]})"; exit 1; }
          echo "sha=${run[2]}" >> "$GITHUB_OUTPUT"
          echo "CUE_BENCH_COMMIT=${run[2]}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cue-release
          path: .
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Measure
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 bench
      - name: Table against the baseline
        if: always()
        shell: pwsh
        run: ./scripts/verify/bench-report.ps1 -Summary $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: bench/latest.json
          if-no-files-found: ignore
