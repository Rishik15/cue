# File: .github/workflows/performance.yml
# Purpose: track how fast and how light the release app is over time. It measures and reports; it never fails because of a number, because a shared runner's memory, CPU and timings move with the machine and the WebView2 version. Bench failures here mean the app did not run, not that it got slower.
# Contents: triggers (main, weekly, manual), one job that builds the release exe, runs the bench, writes a table against bench/baseline.json to the run summary and keeps the raw JSON as an artifact. Hard checks are in ci.yml (lifecycle); the numbers you act on come from `scripts/cue.ps1 bench` on your own machine.
name: Performance

on:
  push:
    branches: [main]
    paths: ["src/**", "src-tauri/**", "scripts/verify/**", "scripts/lib/**", "scripts/cue.ps1", "bench/**", "package.json", "pnpm-lock.yaml", ".github/workflows/performance.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  track:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Build the release exe
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 release
      - name: Measure
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cue.ps1 bench -Cycles 30 -Dictations 10 -IdleSeconds 20
      - name: Table against the baseline
        if: always()
        shell: pwsh
        run: ./scripts/verify/bench-report.ps1 -Summary $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: bench/latest.json
          if-no-files-found: ignore
